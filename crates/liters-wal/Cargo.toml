[package]
name = "liters-wal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLite WAL and database-header reading for liters"

[dependencies]
thiserror = { workspace = true }

[dev-dependencies]
# Tests build their own fixture databases; bundle SQLite so the test suite is
# hermetic and independent of whatever libsqlite3 the host happens to ship.
rusqlite = { workspace = true, features = ["bundled"] }
tempfile = { workspace = true }
