[package]
name = "liters-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UniFFI bindings for liters (Swift/Kotlin)"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "liters_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
# Off unless asked for. Without this the bin is part of every build, and since
# it needs `uniffi/cli`, so is `uniffi_bindgen` -- see the `cli` feature.
required-features = ["cli"]

[features]
# S3 is off by default: it pulls in object_store + the reqwest/hyper/rustls/
# tokio async stack (several MB of `.so`) that a mobile app following over
# HTTP never uses. Enable it (`--features s3`) to expose the `Storage::S3`
# variant.
default = ["bundled-sqlite"]
s3 = ["liters/s3"]

# The `uniffi-bindgen` binary, and the `uniffi/cli` feature it needs.
#
# Off by default because `uniffi/cli` pulls in `uniffi_bindgen` -- askama,
# cargo_metadata, goblin, clap and the rest of a code generator -- and cargo
# unifies features across the whole graph, so declaring it unconditionally
# makes it a NORMAL dependency of anything that depends on this crate. A host
# cross-compiling the staticlib for an iPhone then builds a developer tool it
# cannot run and does not link, once per target, at opt-level 3, with no way
# to switch it off from its own manifest.
#
# Generate bindings with `cargo run -p liters-ffi --features cli --bin
# uniffi-bindgen -- ...`, or point uniffi-bindgen at the built library.
cli = ["uniffi/cli"]

# SQLite linkage, forwarded to `liters` (which is depended on with
# `default-features = false`, so the choice has to be re-exported here or the
# default would be silently lost). Build with `--no-default-features` to link
# the platform libsqlite3 — mandatory for an iOS app whose Swift side already
# links Apple's system SQLite through GRDB. See `liters`' Cargo.toml for why.
bundled-sqlite = ["liters/bundled-sqlite"]
system-sqlite-bindgen = ["liters/system-sqlite-bindgen"]

[dependencies]
liters = { path = "../liters", default-features = false, features = ["http"] }
uniffi = { version = "0.32" }
thiserror = { workspace = true }

[dev-dependencies]
# Tests build their own fixture databases; bundle SQLite so the test suite is
# hermetic and independent of whatever libsqlite3 the host happens to ship.
rusqlite = { workspace = true, features = ["bundled"] }
tempfile = { workspace = true }
