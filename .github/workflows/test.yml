name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.26.4'
          cache-dependency-path: tests/oracle-helper/go.sum

      # reference/ is not checked in. The pinned ref lives in the Makefile so
      # CI and a local clone fetch the same commit.
      - name: Fetch litestream reference checkout
        run: make reference

      - name: Install MinIO (S3 oracle tests skip without it)
        run: |
          curl -sSfL https://dl.min.io/server/minio/release/linux-amd64/minio -o /tmp/minio
          chmod +x /tmp/minio
          sudo mv /tmp/minio /usr/local/bin/minio

      - name: Build Go oracle binaries
        run: make oracle

      - name: Run tests
        run: make test

      # The other linkage. `bundled-sqlite` is on by default, so everything
      # above compiles SQLite's amalgamation and nothing exercises the
      # platform libsqlite3 that an embedder sharing a process with another
      # SQLite (an iOS app on GRDB, say) is required to link instead. The two
      # do not fail alike: a restored replica carrying a WAL header with no
      # -shm is readable under the bundled 3.50.2 and CANTOPEN under 3.51.
      - name: Run tests against the platform libsqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          cargo test -p liters -p liters-ffi --no-default-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The platform libsqlite3 again, but a NEWER one. The ubuntu job's
  # libsqlite3-dev is old enough to tolerate a WAL journal-mode header with no
  # -shm alongside it; macOS ships SQLite 3.51, which returns CANTOPEN on a
  # read-only open of exactly that file. That difference is the whole substance
  # of the restored-replica fix (upstream #6), and the ubuntu job structurally
  # cannot see it — a regression there would land green. This job is the guard.
  #
  # No MinIO: the S3 oracle tests skip without it, which is fine here. Go is
  # preinstalled on the macOS runners, so the rest of the oracle still builds.
  macos-system-sqlite:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `make test-system-sqlite` (not a bare cargo invocation): it fetches the
      # reference checkout, makes the oracle a hard prerequisite, and pins the
      # package selection that keeps `bundled` out of the feature union.
      - name: Run tests against Apple's system libsqlite3
        run: make test-system-sqlite
